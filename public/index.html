<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location sharing application</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <style>
        #map{
            height:90vh
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <script src="/socket.io/socket.io.js"></script>

    <script>
        const users = new Map();
        const token = localStorage.getItem("token");
        if (!token) {
    alert("Not logged in. Please login first.");
}
        const socket = io("http://localhost:8000", {
    auth: {
        token
    }
});
socket.on("server:location:update", (data) => {
    const { id, latitude, longitude } = data;

    // if marker already exists → update it
    if (users.has(id)) {
        const marker = users.get(id);
        marker.setLatLng([latitude, longitude]);
    } 
    // else create new marker
    else {
        const marker = L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup(`User: ${id}`);

        users.set(id, marker);
    }
});



        const map = L.map('map').setView([51.505, -0.09], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        function getUsersCurrentLocation(){
            return new Promise((res,rej) => { 
                if ("geolocation" in navigator){
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        console.log(`Got user's location`, position);
                        const latitude = position.coords.latitude;
                        const longitude = position.coords.longitude;
                        res({latitude,longitude});
                    },
                    (err) => {
                        rej(err);
                    },
                    {enableHighAccuracy: true},
                )
            }else{
                alert('Geolocation is not available in this browser')
            }
             });
            
        };
        let myCurrentLocationMarker = null;
        async function main (){
            setInterval(async () => {
                const {latitude,longitude} = await getUsersCurrentLocation()
                socket.emit('client:location:update',{latitude, longitude});
                if(!myCurrentLocationMarker){
                    myCurrentLocationMarker = L.marker([latitude, longitude])
                    .addTo(map)
                    .bindPopup('You are here')
                    .openPopup();
                }else {
                    myCurrentLocationMarker.setLatLng([latitude, longitude]);
                }
            }, 4*1000)
        }
        window.addEventListener('load',main)
    </script>
</body>
</html>
